name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Web Application
        run: npm run build

      - name: Package Windows Executable
        run: node scripts/package-app.cjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "FITNESS LEGENDS Control de Acceso ${{ github.ref_name }}"
          files: release/ControlDeAccesoLegends-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
