<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Dashboard - FitZone</title>

<link rel="stylesheet" href="/assets/gym_management/css/styles.css" />

<style>

body {
    background: #f5f7fb;
}

.container {
    max-width: 1200px;
    margin: auto;
}


.dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
}

.dashboard-header h1 {
    font-size: 28px;
}

.dashboard-header p {
    color: gray;
}


.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 20px;
}


.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    transition: 0.3s;
    position: relative;
    overflow: hidden;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}

.card h2 {
    font-size: 26px;
    margin: 0;
    color: #2a9d8f;
}

.card p {
    margin-top: 6px;
    color: #666;
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 4px;
    width: 100%;
    background: linear-gradient(90deg, #2a9d8f, #f4a261);
}


.section {
    margin-top: 40px;
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.section h2 {
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    color: #555;
}

.badge {
    background: #f4a261;
    padding: 5px 10px;
    border-radius: 8px;
    color: white;
    font-size: 12px;
}


.skeleton {
    height: 20px;
    background: #eee;
    border-radius: 6px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
}

</style>

</head>

<body>

<nav class="navbar">
  <div class="logo">Fit<span>Zone</span></div>
</nav>

<div class="container">

    <div class="dashboard-header">
        <div>
            <h1>Admin Dashboard</h1>
            <p>Real-time system overview & analytics</p>
        </div>
    </div>

    
    <div class="grid">

        <div class="card">
            <h2 id="revenue">₹0</h2>
            <p>Total Revenue</p>
        </div>

        <div class="card">
            <h2 id="members">0</h2>
            <p>Active Members</p>
        </div>

        <div class="card">
            <h2 id="trainers">0</h2>
            <p>Total Trainers</p>
        </div>

        <div class="card">
            <h2 id="attendance">0</h2>
            <p>Today Attendance</p>
        </div>

    </div>

    
    <div class="section">

        <h2>Expiring Memberships (Next 7 Days)</h2>

        <table>
            <thead>
                <tr>
                    <th>Member</th>
                    <th>End Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="expiringTable">
                <tr><td colspan="3">Loading...</td></tr>
            </tbody>
        </table>

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", loadDashboard);

async function loadDashboard() {

    try {

        const res = await fetch(
            "/api/method/gym_management.web_api.dashboard.get_admin_dashboard",
            { credentials: "include" }
        );

        const json = await res.json();

        const result = json.message;

        if (!result || result.status !== "success") {
            console.error(result);
            alert(result?.message || "Failed to load dashboard");
            return;
        }

        const data = result.data || {};

        
        animateNumber("revenue", data.total_revenue || 0, "₹");
        animateNumber("members", data.active_members || 0);
        animateNumber("trainers", data.trainer_count || 0);
        animateNumber("attendance", data.attendance_today || 0);


        const tbody = document.getElementById("expiringTable");
        tbody.innerHTML = "";

        (data.expiring || []).forEach(m => {

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${m.member || "-"}</td>
                <td>${m.end_date || "-"}</td>
                <td><span class="badge">Expiring</span></td>
            `;

            tbody.appendChild(tr);
        });

    } catch (err) {
        console.error("Dashboard error:", err);
        alert("Server error loading dashboard");
    }
}


function animateNumber(id, value, prefix = "") {

    let el = document.getElementById(id);
    let start = 0;
    let end = parseInt(value) || 0;

    let duration = 800;
    let stepTime = 20;
    let steps = duration / stepTime;
    let increment = end / steps;

    let current = 0;

    let timer = setInterval(() => {
        current += increment;

        if (current >= end) {
            current = end;
            clearInterval(timer);
        }

        el.innerText = prefix + Math.floor(current);

    }, stepTime);
}

</script>

</body>
</html>
