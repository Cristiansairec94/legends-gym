<!DOCTYPE html>
<html>
<head>
  <title>My Training Schedule</title>
  <link rel="stylesheet"
        href="/assets/gym_management/css/styles.css">
</head>

<body>

<div class="container">

<h1>My Training Schedule</h1>

<div id="scheduleContainer"></div>

</div>

<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    loadSchedules();

  }
);

async function loadSchedules() {

  try {

    const res = await fetch(
      "/api/method/gym_management.web_api.training.get_my_training_schedule",
      {
        credentials: "include"
      }
    );

    const json = await res.json();

    // console.log(json);

    if (!json.message) {

      alert("API Error");
      return;

    }

    const result = json.message;

    if (result.status !== "success") {

      alert(result.message || "Failed");
      return;

    }

    const container =
      document.getElementById("scheduleContainer");

    container.innerHTML = "";

    result.data.forEach(s => {

      const div = document.createElement("div");

      div.className = "trainer-card";

      div.innerHTML = `
        <div class="info">
          <h3>${s.workout_type || ""}</h3>
          <p>Trainer: ${s.trainer || ""}</p>
          <p>Status: ${s.attendance_status || ""}</p>
          <p>Days: ${(s.days || []).join(", ")}</p>
        </div>
      `;

      container.appendChild(div);

    });

  }

  catch (err) {

    // console.error(err);

    alert("Server Error");

  }

}

</script>

</body>
</html>
